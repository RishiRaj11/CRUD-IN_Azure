name: Deploy Node App to Azure

on:
  push:
    branches:
      - staging
      - main

env:
  AZURE_RG: ${{ secrets.AZURE_RG }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ github.ref == 'refs/heads/main' && secrets.AZURE_WEBAPP_NAME_PROD || secrets.AZURE_WEBAPP_NAME_STAGING }}
          package: .
